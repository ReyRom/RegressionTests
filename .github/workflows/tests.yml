name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest #windows-latest macos-latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      
      - name: Restore dependency
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run Tests
        run: dotnet test --no-build --logger "trx:LogFileName=test_results.trx" --results-directory ./test_results

      - name: Generate Report
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: "**/*.trx"
          reporter: dotnet-trx